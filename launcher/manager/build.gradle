plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    testOptions {
        unitTests.returnDefaultValues = true
    }
    namespace 'zone.vgs.tvsach'
    compileSdk 35

    defaultConfig {
        applicationId 'zone.vgs.cleantv'
        minSdk 26
        targetSdk 35
        versionCode 17
        versionName '1.7'
        ndk {
            abiFilters += ['arm64-v8a', 'armeabi-v7a']
        }
    }

    signingConfigs {
        debug {
            // Default Android debug keystore
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    // APK launcher đóng sẵn: không nén lại để đọc nhanh.
    androidResources {
        noCompress += 'apk'
    }

    packagingOptions {
        resources {
            excludes += [
                'META-INF/versions/9/OSGI-INF/MANIFEST.MF',
                'META-INF/DEPENDENCIES',
                'META-INF/*.version',
                'META-INF/*.kotlin_module',
                'META-INF/AL2.0',
                'META-INF/LGPL2.1'
            ]
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'

    // ADB qua Wi-Fi (TCP 5555 và ghép đôi Wireless debugging).
    implementation 'com.github.MuntashirAkon:libadb-android:3.1.1'
    implementation 'org.conscrypt:conscrypt-android:2.5.3'
    // Tạo chứng chỉ X.509 cho khoá ADB (cùng dòng jdk15to18 mà libadb đã kéo về).
    implementation 'org.bouncycastle:bcpkix-jdk15to18:1.81'
}
